# /etc/nginx/sites-available/fleet.melticetech.com
# Web UI only. The GPS binary TCP protocol (port 5027) does NOT go through Nginx.
# After enabling: sudo certbot --nginx -d fleet.melticetech.com
server {
    listen 80;
    listen [::]:80;
    server_name fleet.melticetech.com;

    client_max_body_size 5m;

    # static files are served by the app (WhiteNoise), so /srv stays private to the 'fleet' account
    location / {
        proxy_pass http://127.0.0.1:9040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
